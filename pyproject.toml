[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "KumiType"
version = "0.1.0"
description = "Reproducible Cascadia and Japanese font builder"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
dependencies = ["fonttools>=4.55", "PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
kumitype = "kumitype.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
