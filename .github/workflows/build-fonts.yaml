name: Reusable font build
on:
  workflow_call:
    inputs:
      families:
        type: string
        default: ''
      bases:
        type: string
        default: ''
      japanese_fonts:
        type: string
        default: ''
      artifact_name:
        type: string
        default: font-build-reports
      source_date_epoch:
        type: string
        default: ''
      quality_checks:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14.7'
          enable-cache: true
          version: '0.13.5'
      - run: uv sync --locked --extra dev
      - uses: actions/cache@v4
        with:
          path: |
            cache
            !cache/instances
            !cache/outlines
            source
          key: sources-v2-${{ runner.os }}-${{ hashFiles('config/sources.lock.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y fontconfig libharfbuzz-bin
      - name: Set reproducible commit timestamp
        env:
          EPOCH: ${{ inputs.source_date_epoch }}
        run: echo "SOURCE_DATE_EPOCH=${EPOCH:-$(git show -s --format=%ct HEAD)}" >> "$GITHUB_ENV"
      - run: uv run --locked kumitype fetch
      - name: Build, audit, validate and package selected families
        env:
          FAMILIES: ${{ inputs.families }}
          BASES: ${{ inputs.bases }}
          JAPANESE_FONTS: ${{ inputs.japanese_fonts }}
        shell: bash
        run: |
          selectors=()
          [[ -z "$FAMILIES" ]] || selectors+=(--family "$FAMILIES")
          [[ -z "$BASES" ]] || selectors+=(--base "$BASES")
          [[ -z "$JAPANESE_FONTS" ]] || selectors+=(--jp "$JAPANESE_FONTS")
          uv run --locked kumitype list "${selectors[@]}"
          uv run --locked python scripts/release.py "${selectors[@]}" --jobs auto
      - if: inputs.quality_checks && inputs.families == '' && inputs.bases == '' && inputs.japanese_fonts == ''
        run: uv run --locked python scripts/check-goal.py --only G7 --build-dir build-quality > build-quality-goal.json
      - if: inputs.quality_checks && (inputs.families != '' || inputs.bases != '' || inputs.japanese_fonts != '')
        run: uv run --locked python scripts/check-fontbakery.py --build-dir build --output-dir build-quality/fontbakery
      - if: inputs.quality_checks
        run: uv run --locked python scripts/generate-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_name }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/**/*.json
            build/**/*.log
            build/preview.html
            build-quality-goal.json
            build-quality/fontbakery/
            dist/*.zip
