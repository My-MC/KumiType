name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14.7']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '${{ matrix.python }}'
          enable-cache: true
          version: "0.13.5"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked mypy src
      # The release integration test exercises mandatory real hb-shape checks.
      - run: sudo apt-get update && sudo apt-get install -y libharfbuzz-bin
      - run: uv run --locked pytest
