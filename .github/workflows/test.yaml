name: Tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14.7']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '${{ matrix.python }}'
          enable-cache: true
          version: "0.13.5"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kumitype-builder:local .
      - run: docker run --rm -v "$PWD:/work" kumitype-builder:local kumitype list
  linux-containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['fedora:44', 'debian:13', 'ubuntu:24.04', 'almalinux:10', 'rockylinux:10']
    container:
      image: '${{ matrix.image }}'
    steps:
      - name: Install system prerequisites
        shell: sh
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y curl git
          else
            apt-get update
            apt-get install -y curl git
          fi
      - uses: actions/checkout@v4
      - name: Test core synthesis
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --locked --extra dev
          uv run --locked ruff check src tests scripts
          uv run --locked pytest
