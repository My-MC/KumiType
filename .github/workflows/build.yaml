name: Full font build
on:
  workflow_dispatch:
    inputs:
      families:
        description: 'Families (comma-separated base/jp or output names; empty selects all)'
        required: false
        default: ''
        type: string
      bases:
        description: 'Base variants (comma-separated; empty selects all)'
        required: false
        default: ''
        type: string
      japanese_fonts:
        description: 'Japanese font IDs (comma-separated; empty selects all)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build-fonts.yaml
    with:
      families: ${{ inputs.families }}
      bases: ${{ inputs.bases }}
      japanese_fonts: ${{ inputs.japanese_fonts }}
